<div class="visor" (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">
  <!-- CONTENEDOR DE IMAGEN ACTUAL -->
  <div class="image-container">
    <img 
      [src]="currentImage" 
      class="current-image" 
      alt="Página {{ currentIndex + 1 }}"
      (click)="next()">
  </div>

  <!-- CONTROLES -->
  <div class="controls">
    <button class="nav-btn prev" (click)="prev()" [disabled]="!canPrev">
      ‹
    </button>
    
    <div class="counter">
      {{ currentIndex + 1 }} / {{ totalImages }}
    </div>
    
    <button class="nav-btn next" (click)="next()" [disabled]="!canNext">
      ›
    </button>
  </div>

  <!-- PUNTOS DE NAVEGACIÓN -->
  <div class="dots">
    <button 
      *ngFor="let dot of dots; let i = index"
      class="dot" 
      [class.active]="i === currentIndex"
      (click)="goToImage(i)">
    </button>
  </div>
</div>
