<section
  class="mapa-page"
  style="--bg-url: url('https://images.unsplash.com/photo-1476231790875-016a80c274f3?auto=format&fit=crop&w=1920&q=80')"
>
  <!-- HERO / Título -->
  <header class="hero">
    <div class="hero__badge"><i class="fa-solid fa-globe"></i></div>
    <h2><span>EXPLORA EL MUNDO</span></h2>
    <div class="hero__underline"></div>
    <p>Descubre cómo el cambio climático está afectando distintas regiones del planeta.</p>
  </header>

  <!-- Contenedor del mapa + overlay de controles -->
  <div class="map-shell">
    <div #mapRef id="map" class="map"></div>

    <div class="map-overlay">
      <div class="panel">
        <h4><i class="fa-solid fa-layer-group"></i> Capas</h4>
        <div class="btns">
          <button class="chip" (click)="switchBase('osm')" [class.is-active]="true">OpenStreetMap</button>
          <button class="chip" (click)="switchBase('satellite')">Satélite</button>
          <button class="chip" (click)="switchBase('terrain')">Relieve</button>
        </div>

        <div class="divider"></div>

        <h4><i class="fa-solid fa-compass"></i> Vista</h4>
        <div class="btns">
          <button class="btn" (click)="recenter()"><i class="fa-solid fa-expand"></i> Recentrar</button>
        </div>

        <p class="hint"><i class="fa-solid fa-hand-pointer"></i> Pasa el cursor para ver detalles • Haz clic para acercar</p>
      </div>
    </div>
  </div>
</section>
