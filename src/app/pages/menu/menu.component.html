<div class="fab-menu" [class.open]="open">
  <!-- Botón principal -->
  <button
    class="fab"
    (click)="toggle()"
    aria-label="Menú Biospace"
    [attr.aria-expanded]="open"
    [attr.aria-controls]="'menu-popover'">
    <span class="seed">🌱</span>
  </button>

  <!-- Lista emergente -->
  <nav
    class="list"
    role="menu"
    id="menu-popover"
    *ngIf="open"
    (keydown)="onListKeydown($event)"
    aria-label="Navegación rápida">
    <button
      class="item"
      role="menuitem"
      *ngFor="let it of items; let i = index"
      [attr.data-idx]="i"
      (click)="go(it.path)"
      (keydown)="onItemKeydown($event, i)">
      <span class="ico" aria-hidden="true">{{ it.icon }}</span>
      <span class="lbl">
        <b>{{ it.label }}</b>
        <small *ngIf="it.hint">{{ it.hint }}</small>
      </span>
    </button>
  </nav>
</div>
